name: Deploy Library Website
on: 
  push:
    branch:
      - main
permissions:
  contents: read
  pages: write
  id-token: write

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      -uses: action/checkout@v4

      -uses: pnpm/action-setup@v4
      with:
        version: 10

      -uses: action/setup-node@v4
      with: 
        node-version: 20
        cache: pnpm
      
      -run: pnpm install
      -run: pnpm build
      -uses: actions/upload-pages-artifact@v3
      with: 
        path: ./dist
      
  deploy: 
    needs: build
    runs-on: ubuntu-latest

    permissions: 
      pages: write
      id-token: write
    
    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
